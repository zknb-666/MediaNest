# 应用兼容基线
fn.minSdk=16
fn.targetSdk=27

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=false
android.sync.suppressAgpWarnings=DEBUGGABLE_AND_MINIFIED_ENABLED,UNSUPPORTED_PROJECT_OPTION_USE,EXTERNAL_NATIVE_BUILD_CONFIGURATION

# AGP 9 统一拒绝 minSdk<21；实际原生编译固定使用支持 API16 的 NDK 16.1.4479499。
android.ndk.suppressMinSdkVersionError=21
